<style>

  --font-display:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --font-mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172020; --ink:#e2ebe9; --muted:#9aaaa6;
    --line:#2b3836; --accent:#4cc2b4; --hot:#f29a50; --cool:#7fa6ee; --neg:#f2786d; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172020; --ink:#e2ebe9; --muted:#9aaaa6;
  --line:#2b3836; --accent:#4cc2b4; --hot:#f29a50; --cool:#7fa6ee; --neg:#f2786d; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:16px/1.55 var(--font-body)}
main{max-width:760px; margin:0 auto; padding:16px 16px 40px; display:flex; flex-direction:column; gap:14px}

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, html="") => { const e = document.createElement(tag);
  for(const k in attrs){ if(k==="class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if(html) e.innerHTML = html; return e; };
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ================= toy tokenizer ================= */
const PIECES = ["the","river","bank","flood","ed","after","storm","i","deposit","cash","at","cat","dog","sat","on","mat",
  "str","aw","berry","token","iz","er","ing","un","believ","able","model","read","man","bites","walk","ran","a","to","in",
  "of","and","is","it","fl","oo","s","came","rain"];
const WORDS = new Set(["the","river","bank","flooded","after","storm","i","deposited","cash","at","cat","dog","sat","on",
  "mat","strawberry","man","bites","unbelievable","a","to","in","of","and","is","it","came","rain"]);
const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");
const VOCAB = new Set([...PIECES, ...LETTERS]);
function idOf(p){ let h = 2166136261; for(const c of p){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 1000 + (Math.abs(h) % 48000); }
function subwords(text){
  const out = [];
  for(const word of text.split(/\s+/).filter(Boolean)){
    let i = 0; const low = word.toLowerCase();
    while(i < word.length){
      const ch = word[i];
      if(!/[a-z]/i.test(ch)){
        // byte fallback: not in the learned vocabulary
        const cp = word.codePointAt(i), s = String.fromCodePoint(cp);
        for(const b of new TextEncoder().encode(s)) out.push({t:"<" + b.toString(16).toUpperCase() + ">", id:b, byte:true});
        i += s.length; continue;
      }
      let len = Math.min(10, word.length - i), hit = null;
      for(; len > 0; len--){ const p = low.slice(i, i+len); if(VOCAB.has(p)){ hit = p; break; } }
      out.push({t: word.slice(i, i+len), id: idOf(hit)}); i += len;
    }
  }
  return out;
}
function words(text){ return text.split(/\s+/).filter(Boolean).map(w=>{ const k = w.toLowerCase().replace(/[^a-z]/g,"");
  return WORDS.has(k) ? {t:w, id:idOf("w:"+k)} : {t:w, unk:true}; }); }
function chars(text){ return Array.from(text).map(c => ({t: c===" " ? "␣" : c, id: c.codePointAt(0)})); }
function chipHTML(tok, showId=true){ return '<span class="chip' + (tok.unk?" unk":"") + (tok.byte?" byte":"") + '">' +
  esc(tok.unk ? "[UNKNOWN]" : tok.t) + (showId && !tok.unk ? "<small>" + tok.id + "</small>" : "") + "</span>"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }

/* ================= embedding map data ================= */
const MAPW = [
  ["cat",.20,.76,"a"],["dog",.27,.70,"a"],["horse",.16,.63,"a"],
  ["car",.76,.78,"v"],["truck",.84,.70,"v"],["bus",.72,.65,"v"],
  ["apple",.30,.24,"f"],["banana",.20,.32,"f"],["mango",.36,.33,"f"],
  ["ran",.75,.26,"m"],["walked",.84,.34,"m"],["jumped",.70,.17,"m"]
];
function rnd(seed){ let x = Math.sin(seed*999)*10000; return x - Math.floor(x); }
const START = MAPW.map((w,i)=>[.08 + .84*rnd(i+1), .08 + .84*rnd(i+41)]);

/* ================= steps ================= */
function switcher(name, options, cur){ // a two-or-more-button switch; the one on/off control style
  const s = el("div",{class:"seg",role:"group","aria-label":name}, options.map(([k,l])=>'<button data-k="'+k+'">'+esc(l)+'</button>').join(""));
  s.sync = c => s.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===c));
  s.sync(cur); return s;
}
// Runs draw(p) for p from 0 to 1 over ms milliseconds; with reduced motion, jumps straight to the end. Returns a stop function.
function animate(draw, ms, done){
  if(reduceMotion){ draw(1); if(done) done(); return ()=>{}; }
  let t0 = null, stop = false;
  const f = now => { if(stop) return; if(t0 === null) t0 = now;
    const p = Math.min(1, (now - t0) / ms); draw(p);
    if(p < 1) requestAnimationFrame(f); else if(done) done(); };
  requestAnimationFrame(f); return ()=>{ stop = true; };
}
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
// A vector drawn as a column of neurons: brightness = size of the number, blue = positive, red = negative.
function neurons(vals, max, cx, top, gap, r){
  return vals.map((v,i)=>'<circle cx="' + cx + '" cy="' + (top + i*gap) + '" r="' + r + '" style="fill:var(' + (v < 0 ? '--neg' : '--cool') + ');stroke:var(--line)" fill-opacity="' +
    (0.06 + 0.94*Math.min(1, Math.abs(v)/max)).toFixed(2) + '"/>').join("");
}

const STEPS = [];
const add = (ch, title, say, render, deeper, x) => STEPS.push({ch, title, say, render, deeper, x: x || {}});

/* ---------- Overview: the whole machine, before zooming in ---------- */
add("M","The whole machine, then zoom in",
 "An LLM does one thing: given the tokens so far, score every possible next token. This lesson covers the first three boxes.",
 v=>{
  const ids = subwords("The river bank").map(t=>t.id);
  const BOX = [[80,"Tokenizer","text → IDs"],[192,"Embedding","+ position"],[304,"Attention","mix in context"],[416,"MLP","per token"],[528,"Scores","every token"]];
  const W = 96, XS = [36, ...BOX.map(b=>b[0] + W/2), 700];
  const STAGE = ["The river bank", "IDs " + ids.join(" "), "3 vectors", "context-aware vectors", "context-aware vectors", "scores for ~100k tokens", "next: flooded"];
  const pic = el("div",{class:"scroll"}), btn = el("button",{},"Run ▶");
  let stop = ()=>{};
  const draw = p=>{
    const x = XS[0] + (XS[XS.length-1] - XS[0])*p;
    let k = 0; for(let i=1;i<XS.length;i++) if(x >= XS[i] - 0.5) k = i;
    const label = STAGE[k], cw = label.length*7.3 + 18, cx = Math.max(cw/2 + 2, Math.min(758 - cw/2, x));
    let s = '<svg viewBox="0 0 760 212" style="min-width:600px" role="img" aria-label="Pipeline: text, tokenizer, embedding with position, attention and MLP repeated N times, scores over the vocabulary, next token"><defs><marker id="ov-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>' +
      '<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">' +
      '<rect x="296" y="24" width="224" height="88" rx="10" fill="none" style="stroke:var(--muted)" stroke-dasharray="5 4"/>' +
      '<text x="408" y="16" text-anchor="middle" style="fill:var(--muted)">× N layers (32 in an 8B model)</text>' +

/* ---------- 1.1 Tokenization ---------- */
add("1.1","Models read numbers, not text",
 "A tokenizer cuts text into pieces from a fixed list (the vocabulary) and swaps each piece for its ID. Type anything.",
 v=>{
  const inp = el("input",{type:"text","aria-label":"Text to tokenize",value:"The river bank flooded"});
  const out = el("div",{class:"chips"});
  const draw = ()=>{ out.innerHTML = subwords(inp.value).map(t=>chipHTML(t)).join(""); };
  inp.addEventListener("input", draw); v.append(inp, out, el("p",{class:"lbl"},"The small number under each piece is its token ID.")); draw();
 },
 "The small number under each piece is its ID. Try <code>unbelievable</code> or <code>flooooded</code>: a word the tokenizer has never seen still works, because it splits into pieces it knows. This is a toy tokenizer with a tiny vocabulary; real ones have 50k to 200k pieces. Real tokenizers also keep case and the leading space: <code>' bank'</code>, <code>'bank'</code> and <code>'Bank'</code> are different tokens with different IDs.");

add("1.1","Choose the size of the pieces",
 "Small pieces make long sequences; big pieces need a huge vocabulary. Subwords (pieces between a letter and a word) sit in between.",
 v=>{
  let mode = "sub";
  const inp = el("input",{type:"text","aria-label":"Text",value:"The river bank flooooded"});
  const seg = el("div",{class:"seg",role:"group","aria-label":"Piece size"},
    '<button data-m="char">Characters</button><button data-m="sub">Subwords</button><button data-m="word">Words</button>');
  const out = el("div",{class:"chips"});
  const meters = el("div",{class:"meters"});
  const VOC = {char:["a few hundred","characters (256 if you use bytes)"], sub:["~100k","common chunks"], word:["millions","every word, name, typo, language"]};
  const draw = ()=>{
    const toks = mode==="char" ? chars(inp.value) : mode==="word" ? words(inp.value) : subwords(inp.value);
    out.innerHTML = toks.map(t=>chipHTML(t,false)).join("");
    meters.innerHTML = '<div class="meter"><b>' + toks.length + '</b><span>tokens for this text</span></div>' +
      '<div class="meter"><b>' + VOC[mode][0] + '</b><span>vocabulary: ' + VOC[mode][1] + '</span></div>';
    seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode));
  };
  seg.addEventListener("click", e=>{ if(e.target.dataset.m){ mode = e.target.dataset.m; draw(); } });
  inp.addEventListener("input", draw);
  v.append(seg, inp, out, meters); draw();
 },
 "Characters: the sequence gets long, and attention compares every token with every other, so cost grows with the <em>square</em> of length (you'll see this near the end of 1.3). Words: a word not in the list becomes <code>[UNKNOWN]</code> and the model learns nothing about it, and rare words barely get trained. Subwords: any text can be built from known pieces.");

add("1.1","The model never sees letters",
 "The model sees token IDs, not letters, so it can't reliably count the r's in “strawberry”. Switch to what it actually receives.",
 v=>{
  let ids = false;
  const btn = switcher("View", [["pieces","Pieces"],["ids","What the model sees"]], "pieces");

    note.textContent = ids ? "Three opaque numbers. Nothing in " + toks[0].id + " says “contains an r”." : "What you see: three pieces, letters visible.";
    btn.sync(ids ? "ids" : "pieces");
  };

  v.append(btn, out, note); draw();
 },
 "To count letters the model would have to have memorized how each of its token IDs is spelled. Same root cause for reversing words, rhymes and long-number arithmetic. Backend version: counting the characters in a customer's name when you only receive <code>customer_id</code>.");

add("1.1","Other languages pay more",
 "In this toy, the same sentence costs 4 tokens in English and 36 in Hindi, because it has no Hindi pieces at all. Real tokenizers do better, but other languages still cost more.",
 v=>{
  const en = "The river flooded", hi = "नदी में बाढ़ आई";
  const a = subwords(en), b = subwords(hi);
  const max = Math.max(a.length, b.length);
  v.innerHTML =
   '<div class="lbl">English: ' + esc(en) + '</div><div class="chips">' + a.map(t=>chipHTML(t,false)).join("") + '</div>' +
   '<div class="lbl">Hindi (same meaning): ' + esc(hi) + '</div><div class="chips">' + b.map(t=>chipHTML(t,false)).join("") + '</div>' +
   '<div class="bars">' +
   '<div class="bar"><span>English</span><div class="t"><div class="f" style="width:' + (a.length/max*100) + '%"></div></div><span class="n">' + a.length + '</span></div>' +
   '<div class="bar"><span>Hindi</span><div class="t"><div class="f" style="width:' + (b.length/max*100) + '%"></div></div><span class="n">' + b.length + '</span></div></div>' +
   '<p class="mono"><b style="color:var(--hot)">' + Math.round(b.length/a.length) + '× more tokens</b> for the same meaning (toy, worst case)</p>';
 },
 "More tokens for the same meaning means higher cost (billed per token), slower output (one token per step), less fits in the context window, and usually worse quality. Training the model afterwards can't fix it, because the tokenizer was built and frozen first. Real tokenizers have some Hindi pieces, so the gap is smaller than this toy's, but it's real. Backend version: a compression dictionary trained on English logs, used on other data.");

/* ---------- 1.2 Embeddings ---------- */
const TABLE = [
  ["the",   [ 0.12,-0.80, 0.33, 0.05]],
  ["cat",   [ 0.91, 0.05,-0.47, 0.62]],
  ["dog",   [ 0.88, 0.11,-0.41, 0.58]],
  ["sat",   [-0.30, 0.72, 0.18,-0.09]],
  ["on",    [ 0.02,-0.55, 0.40, 0.21]],
  ["mat",   [ 0.40, 0.33,-0.12,-0.70]]
];
add("1.2","A vector is just a list of numbers",
 "A vector is a list of numbers; two numbers draw as an arrow (how far right, how far up). Embeddings are vectors. Move the sliders.",
 v=>{
  const a = slider("v1x","first number (money-ness)",-3,3,0.5,2), b = slider("v1y","second number (water-ness)",-3,3,0.5,1);

  [a,b].forEach(s=>s.inp.addEventListener("input",draw)); v.append(a.w,b.w,out,pic); draw();
 },
 "Real embeddings have thousands of numbers, so you can't draw them, but every rule that follows works the same way with 2 numbers or 4,096. The names money-ness and water-ness are labels for this toy only.");

add("1.2","Each ID picks a row",
 "The embedding table has one row of numbers per token. “Embedding a token” just means reading its row. Tap a word.",
 v=>{
  const sent = ["the","cat","sat","on","the","mat"];
  let sel = 1;
  const chipsEl = el("div",{class:"chips"}), tbl = el("div",{class:"scroll",style:"flex:1 1 380px"}), vec = el("div",{class:"vec"}), colBox = el("div",{style:"flex:0 0 200px"});
  const drawCol = p=>{ const w = sent[sel], row = TABLE.find(r=>r[0]===w)[1];
    colBox.innerHTML = '<svg viewBox="0 0 200 210" style="max-width:200px" role="img" aria-label="' + w + '\'s row drawn as a column of neurons"><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">' +
      '<text x="40" y="16" text-anchor="middle" font-weight="600" style="fill:var(--hot)">' + w + '</text>' +
      '<g transform="translate(0,' + (12*(1-p)).toFixed(1) + ')" opacity="' + p.toFixed(2) + '">' + neurons(row, 1, 40, 42, 36, 14) +
      row.map((x,i)=>'<text x="64" y="' + (46 + i*36) + '" style="fill:var(' + (x < 0 ? '--neg' : '--cool') + ')">' + (x < 0 ? '−' : '+') + Math.abs(x).toFixed(2) + '</text>').join("") + '</g>' +
      '<text x="40" y="190" text-anchor="middle" style="fill:var(--muted)">⋮ 4,092 more</text>' +
      '<text x="110" y="206" text-anchor="middle" font-size="10" style="fill:var(--muted)">bright = big · blue + · red −</text></g></svg>'; };
  let stopCol = ()=>{};
  const pick = i=>{ sel = i; draw(); stopCol(); stopCol = animate(p=>drawCol(ease(p)), 300); };
  const draw = ()=>{
    chipsEl.innerHTML = sent.map((w,i)=>'<span class="chip tap' + (i===sel?" sel":"") + '" data-i="'+i+'" role="button" tabindex="0">' + w + '<small>' + idOf(w) + '</small></span>').join("");
    const w = sent[sel];
    tbl.innerHTML = '<table class="emb"><thead><tr><td>ID</td><td>token</td><td>dim 1</td><td>dim 2</td><td>dim 3</td><td>dim 4</td><td></td></tr></thead><tbody>' + TABLE.map(([t,r])=>'<tr class="' + (t===w?"hit":"") + '"><td>' + idOf(t) + '</td><td>' + t + '</td>' + r.map(x=>'<td>' + x.toFixed(2) + '</td>').join("") + '<td>…</td></tr>').join("") +
      '<tr><td colspan="7" style="text-align:left">… one row for every token in the vocabulary</td></tr></tbody></table>';
    const row = TABLE.find(r=>r[0]===w)[1];
    vec.textContent = w + " → [" + row.map(x=>x.toFixed(2)).join(", ") + ", … 4,092 more numbers]";
  };
  chipsEl.addEventListener("click", e=>{ const c = e.target.closest("[data-i]"); if(c) pick(+c.dataset.i); });
  chipsEl.addEventListener("keydown", e=>{ const c = e.target.closest("[data-i]"); if(c && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); pick(+c.dataset.i); } });
  const side = el("div",{class:"side"}); side.append(tbl, colBox);
  v.append(chipsEl, side, vec); draw(); drawCol(1);
 },
 "Rows = vocabulary size (set by the tokenizer). Row width = a design choice, like 768 in a small model or 4,096 in a mid-size 7–8B model; the largest use 16,384. 100,000 × 4,096 is about 410 million numbers. Both <code>the</code>s read the same row: the table has no idea of context. Why not feed the ID itself? IDs are labels, not quantities. 1001 and 1002 are unrelated, like auto-increment keys, so arithmetic on them is meaningless.");

add("1.2","Training moves similar words together",
 "Training pulls words used in similar sentences close together. Rows start random; every correction nudges them. Drag the slider.",
 v=>{
  const lab = el("label",{class:"lbl",for:"trainS"},"training progress: 0%");
  const s = el("input",{type:"range",id:"trainS",min:"0",max:"100",value:"0"});
  const svg = el("div");
  const draw = ()=>{
    const t = +s.value/100, e = t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    lab.textContent = "training progress: " + s.value + "%";
    svg.innerHTML = mapSVG(MAPW.map((w,i)=>[START[i][0] + (w[1]-START[i][0])*e, START[i][1] + (w[2]-START[i][1])*e]), t>.85);
  };
  s.addEventListener("input", draw); v.append(lab, s, svg); draw();
 },
 "A 2D picture of what really happens in thousands of dimensions. Nobody labels “cat” as an animal: sentences like “feed the ___” and “the ___ is sleeping” push cat and dog the same way. Backend version: recommendation systems learn user and item vectors the same way, and similar behaviour ends up nearby.");

add("1.2","Close means similar, and that is how it generalizes",
 "Nearby rows give nearly the same output, so what the model learns about cat carries over to dog. Tap two words to measure their distance.",
 v=>{
  let picks = [0,1];
  const svg = el("div"), out = el("p",{class:"say"});
  const pos = MAPW.map(w=>[w[1],w[2]]);
  const draw = ()=>{
    svg.innerHTML = mapSVG(pos, true, picks);
    const [a,b] = picks.map(i=>pos[i]);
    const d = Math.hypot(a[0]-b[0], a[1]-b[1]) * 10;
    out.innerHTML = "<b>" + MAPW[picks[0]][0] + "</b> ↔ <b>" + MAPW[picks[1]][0] + "</b>: distance " + d.toFixed(1) + (d < 2 ? " (close: the model treats them alike)" : " (far)");
    svg.querySelectorAll("[data-w]").forEach(g=>g.addEventListener("click", ()=>{ picks = [picks[1], +g.dataset.w]; draw(); }));
  };
  v.append(svg, out); draw();
 },
 "Everything after the embedding is built from smooth functions (multiply, add, softmax, gentle curves), so small input changes give small output changes. That means what the model learns from “the cat sat” carries over to “the dog sat”. That is generalization. Real models usually measure the angle between vectors (cosine similarity) rather than straight distance; the idea is the same.");

add("1.2","Position: order changes meaning",
 "Embeddings say what a token is, not where it is, and attention by itself compares contents, not places. Without position, “dog bites man” and “man bites dog” hand attention the same three vectors.",
 v=>{
  let on = false;
  const btn = switcher("Position", [["off","Without position"],["on","With position"]], "off");
  const out = el("div",{class:"visual"});
  const S = [["dog","bites","man"],["man","bites","dog"]], VEC = {dog:"[0.9, 0.1]", bites:"[−0.3, 0.7]", man:"[0.6, 0.2]"};
  const draw = ()=>{
    out.innerHTML = S.map(s=>'<div class="chips">' + s.map((w,i)=>'<span class="chip">' + w + '<small>' + VEC[w] + (on ? ' + slot ' + i : '') + '</small></span>').join("") + '</div>').join("") +
      '<p class="lbl">' + (on ? "With position stamped on, “dog + slot 0” and “dog + slot 2” are different vectors, so the two inputs differ." : "Without position: both sentences hand attention the same three vectors. It compares contents, not places, so it can't tell who bit whom.") + '</p>';
    btn.sync(on ? "on" : "off");
  };
  btn.addEventListener("click", e=>{ if(e.target.dataset.k){ on = e.target.dataset.k==="on"; draw(); } });
  v.append(btn, out); draw();
 },
 "Position also gives distance: a “river” right next to “bank” should count more than one 300 tokens back, and without position they're identical vectors. Older models add a second table with one row per slot, which is also a hard length limit. Most modern models use RoPE: a formula that rotates vectors by slot number, with no table. Backend version: TCP sequence numbers.");

add("1.2","Training writes. Using only reads.",
 "Weights (the stored tables) never change when you use a model; activations (copies computed per request) are thrown away. Run some requests.",
 v=>{
  let req = 0;
  const pipe = el("div",{class:"pipe"},
    '<div class="box lock" data-tbl>embedding table <span class="pill ok" data-read style="opacity:0">read</span><br><span class="lbl">weights · frozen</span></div><span>→ copy →</span>' +
    '<div class="box">working vector<br><span class="lbl">activation · temporary</span></div><span>→ later steps (1.3) →</span>' +
    '<div class="box" style="border-style:dashed">discarded<br><span class="lbl">after the request</span></div>');
  const fly = el("div",{style:"height:30px"});
  const cnt = el("p",{class:"counter"});
  const btn = el("button",{style:"align-self:flex-start"},"Run a request");
  const tblBox = pipe.querySelector("[data-tbl]"), tag = pipe.querySelector("[data-read]");
  const draw = ()=>{ cnt.innerHTML = "requests: " + req + ' · rows written to the table: <b style="color:var(--accent)">0</b>'; };
  btn.addEventListener("click", ()=>{
    req++; draw();
    animate(p=>{ const f = reduceMotion ? 1 : Math.sin(Math.PI*p);
      tag.style.opacity = f.toFixed(2); tblBox.style.boxShadow = "0 0 0 " + (3*f).toFixed(1) + "px color-mix(in srgb, var(--accent) 45%, transparent)"; }, 700);
    const f = el("span",{class:"flyer"},"copy of bank's row #" + req);
    fly.innerHTML = ""; fly.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.transform = "translateX(" + (reduceMotion ? 0 : 220) + "px)"; f.style.opacity = "0"; }));
  });
  v.append(pipe, fly, btn, cnt); draw();
 },
 "Two kinds of numbers. <b>Weights</b> (the embedding table and every other learned number) change only during training. <b>Activations</b> are computed fresh for every request, then thrown away. RoPE works on the copy, never on the table. Backend version: weights are read-only database rows; activations are values computed in a SELECT, never an UPDATE.");

/* ---------- 1.3 Attention ---------- */

/* ---------- Basics: the four primitives attention is built from ---------- */
function plane(vecs, R, axes){
  const S = 240, C = S/2, k = (C-20)/R, X = x=>C + x*k, Y = y=>C - y*k;
  let g = '<svg viewBox="0 0 ' + S + ' ' + S + '" style="max-width:300px" role="img" aria-label="Vectors drawn as arrows"><defs>' +
    ['hot','cool','accent','ink'].map(c=>'<marker id="m-'+c+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--'+c+')"/></marker>').join("") +
    '</defs><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">' +
    '<line x1="10" y1="'+C+'" x2="'+(S-10)+'" y2="'+C+'" style="stroke:var(--line)"/><line x1="'+C+'" y1="10" x2="'+C+'" y2="'+(S-10)+'" style="stroke:var(--line)"/>' +
    (axes ? '<text x="'+(S-10)+'" y="'+(C+16)+'" text-anchor="end" style="fill:var(--muted)">'+axes[0]+'</text><text x="'+(C+6)+'" y="18" style="fill:var(--muted)">'+axes[1]+'</text>' : '');
  vecs.forEach(([x,y,c,l,dot,from])=>{ // optional from = [x, y]: the arrow starts there instead of at the origin (tip-to-tail)
    const fx = from ? from[0] : 0, fy = from ? from[1] : 0;
    if(dot) g += '<circle cx="'+X(x)+'" cy="'+Y(y)+'" r="7" style="fill:var(--'+c+')"/>';
    else if(Math.hypot(x-fx,y-fy) > 0.01) g += '<line x1="'+X(fx)+'" y1="'+Y(fy)+'" x2="'+X(x)+'" y2="'+Y(y)+'" style="stroke:var(--'+c+')" stroke-width="2.5" marker-end="url(#m-'+c+')"/>';
    if(l) g += '<text x="'+(X(x)+8)+'" y="'+(Y(y)-6)+'" style="fill:var(--'+c+')" font-weight="600">'+l+'</text>';
  });
  return g + '</g></svg>';
}
function slider(id, label, min, max, stepv, val){
  const w = el("div",{class:"visual",style:"gap:2px"});
  w.innerHTML = '<label class="lbl" for="'+id+'"></label><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+stepv+'" value="'+val+'">';
  const inp = w.querySelector("input"), lab = w.querySelector("label");
  return {w, inp, set:(t)=>{ lab.textContent = label + ": " + t; }};
}

add("B","Dot product: how well two lists match",
 "A dot product scores how well two lists match: multiply matching positions, then add. Same direction scores high, a right angle 0, opposite negative. Move B.",
 v=>{
  const s3 = slider("d3","B first",-3,3,0.5,1), s4 = slider("d4","B second",-3,3,0.5,2), A = [2,1];
  const pic = el("div"), out = el("p",{class:"say"});
  const draw = ()=>{ const a=A, b=[+s3.inp.value,+s4.inp.value];
    s3.set(b[0]); s4.set(b[1]);
    const d = a[0]*b[0] + a[1]*b[1];
    out.innerHTML = '<span class="mono">[' + a.join(", ") + '] · [' + b.join(", ") + '] = ' + a[0] + '×' + b[0] + ' + ' + a[1] + '×' + b[1] + ' = <b>' + d + '</b></span> ' +
      (d > 3 ? "(strong match)" : d > 0 ? "(weak match)" : d === 0 ? "(no match)" : "(opposite)");
    const lb = Math.hypot(b[0], b[1]), la = Math.hypot(a[0], a[1]);
    out.innerHTML += '<br><span class="lbl">angle θ = ' + (lb ? Math.round(Math.acos(Math.max(-1, Math.min(1, d/(la*lb))))*180/Math.PI) + '°' : '—') + ' · length of B = ' + lb.toFixed(2) + '</span>';
    pic.innerHTML = plane([[a[0],a[1],"hot","A"],[b[0],b[1],"cool","B"]],3); };
  [s3,s4].forEach(s=>s.inp.addEventListener("input",draw));
  const grid = el("div",{class:"meters"}); grid.append(s3.w,s4.w);
  v.append(el("p",{class:"lbl"},"A is fixed at [2, 1]. Move B."), grid, out, pic,
    el("p",{class:"lbl"},"The dot product grows with both alignment and length; divide by the lengths and you get cosine similarity, the angle-only version.")); draw();
 },
 "This is the closeness idea from 1.2 turned into one number. Attention uses it to answer “how relevant is that word to me?”");

add("B","Softmax: turn scores into percentages",
 "Softmax turns any scores into positive shares that add up to 100%; bigger scores take a much bigger share. Drag the scores.",
 v=>{
  const names = ["The","river","bank"], init = [0,3,2];
  const ss = names.map((n,i)=>slider("sm"+i,"score for "+n,-2,5,0.5,init[i]));
  const bars = el("div",{class:"bars"}), eq = el("p",{class:"lbl"});
  const draw = ()=>{ const sc = ss.map(s=>+s.inp.value); ss.forEach((s,i)=>s.set(sc[i]));
    const ex = sc.map(Math.exp), z = ex.reduce((a,b)=>a+b,0), w = ex.map(x=>x/z);
    bars.innerHTML = names.map((n,i)=>'<div class="bar"><span>'+n+'</span><div class="t"><div class="f" style="width:'+(w[i]*100).toFixed(1)+'%"></div></div><span class="n">'+(w[i]*100).toFixed(0)+'%</span></div>').join("");
    eq.textContent = "eˢᶜᵒʳᵉ: " + ex.map(x=>x.toFixed(1)).join(", ") + "  → each ÷ " + z.toFixed(1) + " (their total)"; };
  ss.forEach(s=>s.inp.addEventListener("input",draw));
  v.append(...ss.map(s=>s.w), bars, eq); draw();
 },
 "How: raise e (≈2.718) to each score, then divide each by the total. Raising to a power makes every share positive and stretches the gaps, so the winner wins clearly but losers keep a little. Why add up to 100%: the next step is an average, and an average needs shares that sum to 1.");

add("B","Weighted average: blend by the percentages",
 "Mix several vectors using the percentages as the recipe. Slide the recipe and watch the blend move between them.",

  s.inp.addEventListener("input",draw); v.append(s.w,out,pic); draw();
 },
 "Attention = dot product (score every word) → softmax (scores to percentages) → weighted average (blend). One more basic first: how training sets all these numbers.");

add("B","Gradient: how training nudges each number",
 "Training nudges each number in bank's row in proportion to what it's multiplied by. Here bank's score for “flooded” should be 2 but is −1.3. Press Train step, then set the multiplier to 0.",
 v=>{
  const START_ROW = [0.2,-0.5], TARGET = 2, LR = 0.05;
  let row = START_ROW.slice(), hist = [], last = [0,0], prev = null, stop = ()=>{};
  const m1 = slider("g1","number 1 is multiplied by (number 2 is fixed at ×3)",0,3,0.5,1);
  const tbl = el("div",{class:"scroll"}), sc = el("div",{class:"bars"}), arrows = el("div"), hs = el("p",{class:"lbl"});
  const btn = el("button",{},"Train step"), rst = el("button",{class:"ghost"},"Reset");
  const mult = ()=>[+m1.inp.value, 3];
  const score = ()=>row[0]*mult()[0] + row[1]*mult()[1];
  const draw = (p=1)=>{
    const m = mult(); m1.set(m[0]);
    const s1 = score(), s0 = prev === null ? s1 : prev + (s1 - prev)*p, err = TARGET - s0;
    tbl.innerHTML = '<table class="emb"><thead><tr><td>number</td><td>value</td><td>multiplied by</td><td>last nudge</td></tr></thead><tbody>' +
      [0,1].map(i=>'<tr'+(Math.abs(last[i])>0.001?' class="hit"':'')+'><td>number '+(i+1)+'</td><td>'+row[i].toFixed(3)+'</td><td>'+m[i]+'</td><td>'+(last[i]>=0?"+":"")+last[i].toFixed(3)+'</td></tr>').join("") + '</tbody></table>';
    const pct = x=>Math.max(0, Math.min(100, (x+2)/5*100));
    sc.innerHTML = '<div class="bar"><span>score</span><div class="t"><div class="f" style="width:'+pct(s0)+'%"></div></div><span class="n">'+s0.toFixed(2)+'</span></div>' +
      '<div class="bar"><span>target</span><div class="t"><div class="f" style="width:'+pct(TARGET)+'%;background:var(--accent)"></div></div><span class="n">'+TARGET.toFixed(2)+'</span></div>' +
      '<div class="bar"><span>error</span><div class="t"><div class="f" style="width:'+Math.min(100, Math.abs(err)/5*100)+'%;background:var(--muted)"></div></div><span class="n">'+err.toFixed(2)+'</span></div>';
    // nudge arrows: length = step size × error × multiplier, growing over 400 ms
    let a = '<svg viewBox="0 0 360 86" style="max-width:460px" role="img" aria-label="Nudge arrows for each number"><defs><marker id="gr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--hot)"/></marker></defs><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">' +
      '<line x1="190" y1="8" x2="190" y2="80" style="stroke:var(--line)"/>';
    [0,1].forEach(i=>{ const y = 28 + i*36, len = Math.max(-170, Math.min(150, last[i]*300*p));
      a += '<text x="8" y="' + (y+4) + '" style="fill:var(--muted)">nudge ' + (i+1) + ' (×' + m[i] + ')</text>';
      a += Math.abs(last[i]) < 0.001 ? '<circle cx="190" cy="' + y + '" r="3" style="fill:var(--muted)"/><text x="200" y="' + (y+4) + '" style="fill:var(--muted)">' + (m[i] === 0 ? "no nudge: ×0" : "press Train step") + '</text>'
        : '<line x1="190" y1="' + y + '" x2="' + (190+len).toFixed(1) + '" y2="' + y + '" style="stroke:var(--hot)" stroke-width="4" marker-end="url(#gr-arr)"/>'; });
    arrows.innerHTML = a + '</g></svg>';
    hs.textContent = "score history: " + (hist.length ? hist.map(x=>x.toFixed(2)).join(" → ") + " → " : "") + s1.toFixed(2);
  };
  btn.addEventListener("click", ()=>{
    const m = mult(), err = TARGET - score();
    hist.push(score()); if(hist.length > 6) hist.shift();
    prev = score(); last = m.map(x=>LR*err*x); row = row.map((r,i)=>r + last[i]);
    stop(); stop = animate(p=>draw(ease(p)), 400);
  });
  rst.addEventListener("click", ()=>{ stop(); row = START_ROW.slice(); hist = []; last = [0,0]; prev = null; draw(); });
  m1.inp.addEventListener("input", ()=>{ stop(); hist = []; last = [0,0]; prev = null; draw(); });
  const grid = el("div"); grid.append(m1.w);
  const r = el("div",{class:"row"}); r.append(btn, rst);
  v.append(grid, tbl, sc, arrows, r, hs); draw();
 },
 "Nudge = step size × how far off the score is × what the number is multiplied by. A number multiplied by 0 has no influence, so it never moves. Nobody picks a number: every number used in a prediction gets its own nudge, all calculated in one pass (backpropagation). Repeat over billions of sentences and the rows, every other learned table you'll meet in 1.3, everything, settle into useful values. That's all training is. Backend version: 4,096 config knobs, each adjusted in proportion to how sensitive the output is to it, measured all at once.");

add("1.3","The three basics, running together",
 "Attention is the three basics in a row: score, softmax, blend. bank asks the same question (its query) in every sentence; each earlier word answers with its key. Press Play, then switch the sentence.",
 v=>{
  const SENT = {
    river:{label:"The river bank", toks:[["The",[0,0]],["river",[0,3]],["bank",[1,1]]]},
    cash:{label:"cash at the bank", toks:[["cash",[3,0]],["at",[0,0]],["the",[0,0]],["bank",[1,1]]]}
  };
  const q = [1,1]; let k = "river", stop = ()=>{};
  const seg = el("div",{class:"seg",role:"group","aria-label":"Sentence"},'<button data-k="river">The river bank</button><button data-k="cash">cash at the bank</button>');
  const play = el("button",{},"▶ Play");
  const phase = el("p",{class:"lbl"}), tbl = el("div",{class:"scroll"}), res = el("p",{class:"mono"}), pic = el("div",{style:"flex:0 1 300px"}), cols = el("div",{style:"flex:1 1 260px;max-width:380px"}), meter = el("div");
  const cl = t=>Math.max(0, Math.min(1, t));
  const frame = t=>{ // t runs 0 → 3: phase 1 score, 2 softmax, 3 blend
    const a = ease(cl(t)), b = ease(cl(t-1)), c = ease(cl(t-2));
    const toks = SENT[k].toks;
    const sc = toks.map(([,key])=>q[0]*key[0] + q[1]*key[1]);
    const ex = sc.map(Math.exp), z = ex.reduce((x,y)=>x+y,0), w = ex.map(x=>x/z);
    const out = [0,1].map(d=>toks.reduce((s,[,key],i)=>s + w[i]*key[d], 0));
    phase.textContent = t < 1 ? "1. score: query · key for each word" : t < 2 ? "2. softmax: scores → shares that add to 100%" : "3. blend: each value × its share, added tip to tail";
    tbl.innerHTML = '<table class="emb"><thead><tr><td>word</td><td>key</td><td>1. score = query · key</td><td>2. softmax</td></tr></thead><tbody>' +
      toks.map(([tk,key],i)=>'<tr'+(b >= 1 && w[i]>.5?' class="hit"':'')+'><td>'+tk+'</td><td>['+key.join(", ")+']</td><td>1×'+key[0]+' + 1×'+key[1]+' = '+(sc[i]*a).toFixed(1)+'</td><td><span style="display:inline-block;vertical-align:middle;height:10px;border-radius:3px;background:var(--hot);width:'+(w[i]*b*80).toFixed(1)+'px"></span> '+(b > 0 ? (w[i]*b*100).toFixed(0)+'%' : '')+'</td></tr>').join("") + '</tbody></table>';
    // plane: query (orange), keys (blue, grow in phase 1), value pieces (teal, tip to tail in phase 3), new bank (orange dot)
    const vecs = [[q[0],q[1],"hot","q"]];
    toks.forEach(([tk,key])=>{ if(key[0]||key[1]) vecs.push([key[0]*a, key[1]*a, "cool", tk==="bank" ? "" : tk]); });
    let at = [0,0];
    if(c > 0) toks.forEach(([,key],i)=>{ const nx = [at[0] + key[0]*w[i]*c, at[1] + key[1]*w[i]*c]; if(key[0]||key[1]) vecs.push([nx[0], nx[1], "accent", "", false, at]); at = nx; });
    if(c > 0.98) vecs.push([out[0], out[1], "hot", "", true]);
    pic.innerHTML = plane(vecs, 3.6, ["money-ness →","water-ness ↑"]);
    // neuron columns: each earlier value flows into bank's new column, scaled by its share
    const n = toks.length, gx = i=>30 + i*(200/Math.max(1,n-1));
    let s = '<svg viewBox="0 0 340 150" role="img" aria-label="Value columns scaled by their shares flow into bank\'s new column"><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">';
    toks.forEach(([tk,key],i)=>{ const sv = key.map(x=>x*(1 - c + c*w[i]));
      s += '<text x="'+gx(i)+'" y="14" text-anchor="middle" style="fill:var(--ink)">'+tk+'</text>' + neurons(sv, 3, gx(i), 40, 34, 12) +
        '<text x="'+gx(i)+'" y="98" text-anchor="middle" style="fill:var(--muted)">'+(c > 0 ? '× ' + w[i].toFixed(2) : 'value')+'</text>'; });
    s += '<text x="268" y="58" text-anchor="middle" style="fill:var(--muted)">→ sum →</text><text x="315" y="14" text-anchor="middle" font-weight="600" style="fill:var(--hot)">new bank</text>' +
      neurons(out.map(x=>x*c), 3, 315, 40, 34, 12) + '<text x="170" y="135" text-anchor="middle" style="fill:var(--muted)">brightness = size of each number</text>';
    cols.innerHTML = s + '</g></svg>';
    res.textContent = "3. blend → new bank = [" + out.map(x=>(x*c).toFixed(2)).join(", ") + "]   (query stays [1, 1])";
    const x = Math.max(0, Math.min(1, 0.5 + (out[1]-out[0])/6)), mx = 0.5 + (x - 0.5)*c;
    meter.innerHTML = '<svg viewBox="0 0 360 70" style="max-width:440px" role="img" aria-label="Where bank ends up between money and water"><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">' +
      '<line x1="30" y1="30" x2="330" y2="30" style="stroke:var(--line)" stroke-width="6" stroke-linecap="round"/>' +
      '<text x="30" y="60" style="fill:var(--muted)">money</text><text x="330" y="60" text-anchor="end" style="fill:var(--muted)">water</text>' +
      '<circle cx="'+(30+300*mx).toFixed(1)+'" cy="30" r="10" style="fill:var(--hot)"/></g></svg>';
    seg.querySelectorAll("button").forEach(bt=>bt.setAttribute("aria-pressed", bt.dataset.k===k));
  };
  const run = ()=>{ stop(); stop = animate(p=>frame(3*p), 3600); };
  seg.addEventListener("click", e=>{ if(e.target.dataset.k){ k = e.target.dataset.k; run(); } });
  play.addEventListener("click", run);
  const ctl = el("div",{class:"row"}); ctl.append(seg, play);
  const side = el("div",{class:"side"}); side.append(pic, cols);
  v.append(ctl, el("p",{class:"mono"},"bank's row [0.5, 0.5] × W_Q (a 2×2 learned matrix, here [[2, 0], [0, 2]]) = query [1, 1]"),
    el("p",{class:"lbl"},"query [1, 1] = “is anyone here about money or water?” Orange q = bank's query; blue = each word's key (bank's own key is also [1, 1]); teal = value pieces, tip to tail; orange dot = new bank."),
    phase, tbl, side, res, meter); frame(3);
 },
 "<b>Who decides the query?</b> Nobody, by hand. query = bank's row × W_Q, where W_Q is a learned matrix shared by every token. Keys come from another learned matrix, W_K, and the vectors that get blended (values) from a third, W_V. Here values equal keys to keep it simple. All three matrices start random; wrong predictions nudge them until queries pull in useful context, the same way embedding rows learned in 1.2. The matrices are weights (frozen in use); each query, key and value is an activation. I picked [1, 1] so the arithmetic is easy; a real query has thousands of numbers nobody chose. <b>Backend version:</b> a search engine where every document comes back, blended by relevance, instead of only the top hit.");

const ATT = {
  A:{toks:["The","river","bank","flooded","after","the","storm"], sel:2, w:{2:[.05,.70,.25],3:[.02,.28,.55,.15],6:[.02,.20,.10,.35,.10,.05,.18]}},
  B:{toks:["I","deposited","cash","at","the","bank"], sel:5, w:{5:[.03,.38,.34,.08,.04,.13]}}
};
function attW(s,i){ if(s.w[i]) return s.w[i]; const w = new Array(i+1).fill(0); if(i===0){w[0]=1; return w;}
  w[i]=.4; w[i-1]+=.3; const r=.3/Math.max(1,i-1); for(let j=0;j<i-1;j++) w[j]+=r; if(i===1) w[0]+=.3;
  const z=w.reduce((a,b)=>a+b,0); return w.map(x=>x/z); }
function arcsSVG(toks, sel, w){
  const gap = 360/toks.length, xs = toks.map((_,i)=>gap*i + gap/2);
  let s = '<svg viewBox="0 0 360 170" style="max-width:640px" role="img" aria-label="Arcs show how much the selected token attends to each earlier token"><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">';
  const rank = []; for(let j=0;j<sel;j++) rank.push(j); rank.sort((a,b)=>w[b]-w[a]); // draw order: heaviest first
  for(let j=0;j<sel;j++){ const h = Math.min(100, 18 + (sel-j)*14), wt = w[j], r = rank.indexOf(j); // h = arc peak height
    s += '<path data-r="' + r + '" pathLength="1" d="M' + xs[sel] + ',125 C' + xs[sel] + ',' + (125-h/0.75).toFixed(1) + ' ' + xs[j] + ',' + (125-h/0.75).toFixed(1) + ' ' + xs[j] + ',125" fill="none" style="stroke:var(--hot)" stroke-width="' + Math.max(1, wt*16).toFixed(1) + '" stroke-linecap="round" opacity="' + (0.35 + wt*0.65).toFixed(2) + '"/>';
    s += '<text data-r="' + r + '" x="' + ((xs[sel]+xs[j])/2).toFixed(1) + '" y="' + (125 - h - 6).toFixed(1) + '" text-anchor="middle" style="fill:var(--hot);stroke:var(--surface);stroke-width:3;paint-order:stroke">' + wt.toFixed(2) + '</text>'; }
  toks.forEach((t,i)=>{ const st = i===sel ? "fill:var(--hot);font-weight:600" : i>sel ? "fill:var(--muted);opacity:.4" : "fill:var(--ink)";
    s += '<text data-i="' + i + '" x="' + xs[i] + '" y="145" text-anchor="middle" style="' + st + ';cursor:pointer">' + esc(t) + '</text>'; });
  const last = sel === toks.length-1;
  s += '<text x="' + (last ? 358 : xs[sel]) + '" y="162" text-anchor="' + (last ? 'end' : 'middle') + '" style="fill:var(--muted)" font-size="10">self ' + w[sel].toFixed(2) + '</text>';
  return s + '</g></svg>';
}
add("1.3","Who does each token listen to?",
 "Each token blends earlier tokens; arc thickness shows how much. Tap any word. Later words are greyed: a token only looks backward (why comes in 1.7).",
 v=>{
  let k = "A";
  const seg = el("div",{class:"seg",role:"group","aria-label":"Sentence"},'<button data-k="A">River</button><button data-k="B">Money</button>');
  const box = el("div");
  let stop = ()=>{};
  const grow = ()=>{ // arcs draw in order of weight, about 600 ms in total
    const ps = [...box.querySelectorAll("path[data-r]")], ts = [...box.querySelectorAll("text[data-r]")], n = ps.length; if(!n) return;
    const op = ps.map(p=>p.getAttribute("opacity"));

        el2.setAttribute("stroke-dasharray", l >= 1 ? "none" : "1 1"); el2.setAttribute("stroke-dashoffset", (1 - l).toFixed(3)); el2.setAttribute("opacity", l > 0 ? op[i] : 0); });
      ts.forEach(t=>t.setAttribute("opacity", Math.max(0, Math.min(1, p*n - +t.dataset.r)).toFixed(2))); }, 600); };
  const draw = (anim)=>{ const s = ATT[k]; box.innerHTML = arcsSVG(s.toks, s.sel, attW(s, s.sel));
    box.querySelectorAll("[data-i]").forEach(t=>t.addEventListener("click", ()=>{ s.sel = +t.dataset.i; draw(true); }));
    if(anim) grow();
    seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===k)); };
  seg.addEventListener("click", e=>{ if(e.target.dataset.k){ k = e.target.dataset.k; draw(true); } });
  v.append(seg, box); draw();
 },
 "The weights for one token always add up to 1: it's a blend. Tap “flooded”: it leans on “bank” (what flooded?) and “river”. Weights here are hand-picked to show the idea; a real model learns them and spreads them over many heads and layers.");

add("1.3","Several heads: one blend per need",
 "A head is one copy of attention with its own softmax. One head's shares must add to 100%, so it can't focus sharply on two words at once. bank needs “river” (setting) and “the” (grammar). Compare.",
 v=>{
  let mode = "one";
  const seg = el("div",{class:"seg",role:"group","aria-label":"How many heads"},'<button data-m="one">One head</button><button data-m="two">Two heads</button>');
  const sl = slider("hS","share of attention on river",10,80,5,45);
  const box = el("div",{class:"visual"});
  // values as [setting info, grammar info]
  const V = {the:[0,1], river:[1,0], bank:[0.2,0.2]};
  const blend = w=>[0,1].map(d=>Object.keys(w).reduce((a,t)=>a + w[t]*V[t][d], 0));
  const pct = w=>Object.keys(w).map(t=>'<div class="bar"><span>'+t+'</span><div class="t"><div class="f" style="width:'+(w[t]*100)+'%"></div></div><span class="n">'+Math.round(w[t]*100)+'%</span></div>').join("");
  const kept = (a,b)=>'<div class="meters"><div class="meter"><b>'+Math.round(a*100)+'%</b><span>setting info kept (river)</span></div><div class="meter"><b>'+Math.round(b*100)+'%</b><span>grammar info kept (the)</span></div></div>';
  const seesaw = (a,b)=>{ const ang = ((b - a)*28).toFixed(1);
    return '<svg viewBox="0 0 360 96" style="max-width:420px" role="img" aria-label="Seesaw: setting info against grammar info"><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">' +
      '<path d="M170,86 L180,62 L190,86 z" style="fill:var(--muted)"/><g transform="rotate(' + ang + ' 180 60)"><line x1="40" y1="60" x2="320" y2="60" style="stroke:var(--ink)" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="50" cy="48" r="' + (4 + 10*a).toFixed(1) + '" style="fill:var(--cool)"/><circle cx="310" cy="48" r="' + (4 + 10*b).toFixed(1) + '" style="fill:var(--cool)"/>' +
      '<text x="50" y="80" text-anchor="middle" style="fill:var(--ink)">setting</text><text x="310" y="80" text-anchor="middle" style="fill:var(--ink)">grammar</text></g></g></svg>'; };
  const draw = ()=>{
    if(mode==="one"){
      const r = +sl.inp.value; sl.set(r + "%");
      const w = {the:(90 - r)/100, river:r/100, bank:.10}, o = blend(w);
      box.innerHTML = '<p class="lbl">One head, one softmax, asked for both at once:</p><div class="bars">'+pct(w)+'</div>' +
        '<p class="mono">blend = [' + o.map(x=>x.toFixed(2)).join(", ") + ']</p>' + kept(o[0], o[1]) + seesaw(o[0], o[1]) +
        '<p class="lbl">One head has one set of shares that must add to 100%: push river up and “the” must come down. Both can\'t be high at once.</p>';
    } else {
      const wa = {the:.10, river:.80, bank:.10}, wb = {the:.80, river:.10, bank:.10}, a = blend(wa), b = blend(wb);
      box.innerHTML = '<div class="meters"><div class="visual"><p class="lbl">Head A asks “setting?”</p><div class="bars">'+pct(wa)+'</div><p class="mono">['+a.map(x=>x.toFixed(2)).join(", ")+']</p></div>' +
        '<div class="visual"><p class="lbl">Head B asks “grammar?”</p><div class="bars">'+pct(wb)+'</div><p class="mono">['+b.map(x=>x.toFixed(2)).join(", ")+']</p></div></div>' +
        '<p class="mono">joined: [' + a.concat(b).map(x=>x.toFixed(2)).join(", ") + ']  → × W_O → one vector for bank</p>' + kept(a[0], b[1]) + seesaw(a[0], b[1]) +
        '<p class="lbl">Each head has its own softmax, so each puts 80% on its own word. W_O is a learned matrix that mixes the joined head outputs back to the model\'s width.</p>';
    }
    sl.w.style.display = mode==="one" ? "" : "none";
    seg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mode));
  };
  seg.addEventListener("click", e=>{ if(e.target.dataset.m){ mode = e.target.dataset.m; draw(); } });
  sl.inp.addEventListener("input", draw);
  v.append(seg, sl.w, box); draw();
 },
 "A head is one complete copy of the attention calculation with its own W_Q, W_K, W_V. Heads run at the same time on the same words, independently. Heads split the width rather than adding to it: a model 4,096 wide with 32 heads gives each head 128 numbers, so 32 heads cost about the same as one wide head. Nobody assigns each head's question: they start from different random matrices and gradient nudges each toward whatever helps. The weights here are hand-picked to show the idea. Backend version: fan out one request to several specialized indexes in parallel, then merge the responses.");

add("1.3","Cost grows with the square of the context",
 "Every token scores every token it can see. Drag the slider: double the tokens, about four times the work.",
 v=>{
  const lab = el("label",{class:"lbl",for:"nS"});
  const s = el("input",{type:"range",id:"nS",min:"2",max:"48",value:"8"});
  const c = el("canvas",{width:"300",height:"300","aria-label":"Grid of token pairs",style:"width:300px;height:300px;max-width:100%"});
  const fig = el("div",{style:"display:grid;grid-template-columns:auto 300px;grid-template-rows:auto 300px auto;gap:6px 8px;align-self:flex-start;font:500 .75rem var(--font-mono);color:var(--muted)"});
  fig.innerHTML = '<span></span><span>tokens it scores →</span><span style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center">↓ token doing the looking</span>';
  const t = el("div",{class:"meters"});
  let stop = ()=>{};
  const paint = (n, rows)=>{ // fill the grid row by row
    const ctx = c.getContext("2d"); ctx.clearRect(0,0,300,300); const cell = 300/n, ac = css("--accent"), ln = css("--line");
    for(let i=0;i<rows;i++) for(let j=0;j<n;j++){ ctx.fillStyle = j<=i ? ac : ln;
      ctx.fillRect(j*cell + .5, i*cell + .5, Math.max(1, cell-1), Math.max(1, cell-1)); } };
  const draw = (anim)=>{
    const n = +s.value; lab.textContent = "tokens: " + n;
    stop(); if(anim) stop = animate(p=>paint(n, Math.ceil(p*n)), 350); else paint(n, n);
    t.innerHTML = '<div class="meter"><b>' + (n*n).toLocaleString() + '</b><span>scores for ' + n + ' tokens</span></div>' +
      '<div class="meter"><b>' + ((2*n)*(2*n)).toLocaleString() + '</b><span>scores for ' + (2*n) + ' tokens (4×)</span></div>';
  };
  fig.appendChild(c);
  fig.insertAdjacentHTML("beforeend", '<span></span><span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);vertical-align:middle"></span> scored &nbsp; <span style="display:inline-block;width:10px;height:10px;background:var(--line);vertical-align:middle"></span> later token, not seen</span>');
  s.addEventListener("input", ()=>draw(true)); v.append(lab, s, fig, t,
    el("p",{class:"lbl"},"At short context the per-token work (lookups, MLP) dominates; past tens of thousands of tokens the n² term takes over.")); draw();
 },
 "8,000 tokens → 64 million scores; 16,000 → 256 million; 128,000 → about 16 billion, per head, per layer. Looking only backward removes about half, which doesn't change how it scales. This is why long context is expensive and why token counts (step 5) matter. The rest of the model costs a fixed amount per token, so the square only wins at long context: Kaplan et al. found the context-dependent part stays a small fraction of compute while the model's width is more than the context length ÷ 12, which for a 4,096-wide model means up to about 49,000 tokens. <a href='https://arxiv.org/abs/2001.08361'>Kaplan et al., Scaling Laws for Neural Language Models (2020) ↗</a> Backend version: a self-join done as a nested loop.");

/* ---------- Explanation panels for every Lesson 1 step (attached by step title) ---------- */
const DUO = (a, b) => '<div class="duo"><div><b>Everyday</b><span>' + a + '</span></div><div><b>Technical</b><span>' + b + '</span></div></div>';
const SRC = (href, text) => ' <a href="' + href + '">' + text + ' ↗</a>';
const PANELS = {
  "The whole machine, then zoom in": {
    what: "<p>A <b>large language model (LLM)</b> is one function: in goes the text so far, out comes a score for every token in its vocabulary. The boxes: a <b>tokenizer</b> (text → token IDs), an <b>embedding</b> table (each ID → a list of numbers, plus its position), <b>attention</b> (each token pulls in context from earlier tokens), an <b>MLP</b> (multi-layer perceptron: a small network applied to each token on its own), with attention + MLP stacked N times, then <b>scores</b> over the whole vocabulary.</p>",
    analogy: DUO("An assembly line: raw material enters, each station reshapes it, one product (the next word) comes out. Then the line runs again with that word added to the input.",
                 "A request pipeline: parse → look up → join with context → transform → rank every candidate → return one. Called in a loop, each response appended to the next request."),
    real: "<p>Llama 3 8B, for example, has a 128,000-token vocabulary, vectors 4,096 numbers wide, and 32 layers of attention + MLP. A 100-token answer means about 100 passes through the machine, one per new token.</p>",
    evidence: "<p>Layer count, width and vocabulary size for Llama 3 8B, 70B and 405B are listed in Table 3 of the Llama 3 paper." + SRC("https://arxiv.org/abs/2407.21783","Llama Team, The Llama 3 Herd of Models (2024)") + "</p>"},
  "Models read numbers, not text": {
    what: "<p>A <b>tokenizer</b> splits text into <b>tokens</b> (pieces from a fixed list called the <b>vocabulary</b>) and replaces each with its <b>token ID</b>, a number. The model only ever sees these numbers.</p>",
    analogy: DUO("A library catalogue: books are found by call number, not by reading every cover. The number stands for the book.",
                 "A lexer turning source code into tokens before the parser runs, combined with a dictionary encoder (like Huffman or gzip) that maps frequent pieces to codes."),
    real: "<p>Modern tokenizers use <b>byte-pair encoding (BPE)</b>: start from single bytes, then repeatedly merge the most frequent neighbouring pair into a new token, until the vocabulary reaches its target size (roughly 50k–200k). Training the tokenizer happens once, before the model is trained, and then it's frozen.</p>",
    evidence: "<p>Subword units let a model with a fixed vocabulary handle any word, including rare and unknown ones, by spelling them from smaller pieces." + SRC("https://arxiv.org/abs/1508.07909","Sennrich et al., Neural Machine Translation of Rare Words with Subword Units (2015)") + "</p>"},
  "Choose the size of the pieces": {
    what: "<p>The piece size is a trade-off between <b>sequence length</b> (how many tokens a text becomes) and <b>vocabulary size</b> (how many distinct pieces the model must know).</p>",
    analogy: DUO("Packing for a move: tiny boxes mean hundreds of trips; one giant box per room is impossible to lift. Medium boxes win.",
                 "Choosing a page or chunk size: too small and per-item overhead dominates; too large and you waste space on things you rarely need."),
    real: "<p>Characters make sequences long, and attention cost grows with the square of length. Whole words need millions of entries and fail on any unseen word. Subwords keep both reasonable and can still spell any text.</p>"},
  "The model never sees letters": {
    what: "<p>Each token is one opaque ID. “strawberry” arrives as a few IDs like <code>str</code> + <code>aw</code> + <code>berry</code>; the letters inside each piece are not part of the input.</p>",
    analogy: DUO("Counting the letters in someone's name when you only have their employee number.",
                 "Being asked to count characters in a string when the service only receives <code>customer_id = 48213</code>: the information isn't in the request."),
    real: "<p>To count the r's, the model would have to have memorized how each token is spelled and add across pieces. The same cause breaks reversing words, rhyming, and arithmetic on long numbers.</p>",
    evidence: "<p>Andrej Karpathy traces many odd LLM behaviours, spelling and arithmetic among them, back to tokenization." + SRC("https://www.youtube.com/watch?v=zduSFxRajkE","Let's build the GPT Tokenizer") + "</p>"},
  "Other languages pay more": {
    what: "<p>A tokenizer learns its pieces from its training text. Languages it saw less of get fewer merged pieces, so the same meaning takes more tokens, down to raw bytes in the worst case.</p>",
    analogy: DUO("A phrasebook written for English speakers: common English phrases are one entry; anything else must be spelled out letter by letter.",
                 "A compression dictionary trained on English logs, then applied to other data: it still works, but it barely compresses."),
    real: "<p>More tokens means higher cost (billed per token), slower generation (one token per step), less room in the context window, and usually lower quality. Training the model later can't fix it, because the tokenizer is frozen first.</p>",
    evidence: "<p>The same text translated into different languages can differ in token count by up to 15×, even with tokenizers built for multilingual use, which affects cost, latency, and how much fits in context." + SRC("https://arxiv.org/abs/2305.15425","Petrov et al., Language Model Tokenizers Introduce Unfairness Between Languages (2023)") + "</p>"},
  "A vector is just a list of numbers": {
    what: "<p>A <b>vector</b> is an ordered list of numbers. Two numbers can be drawn as an arrow (right, up); models use lists of thousands, which can't be drawn but follow the same rules.</p>",
    analogy: DUO("GPS coordinates: two numbers pin a place on a map. Change one and the place moves.",
                 "A fixed-length feature array, <code>float[4096]</code>, like a row of numeric columns in a table."),
    real: "<p>In a model, every token becomes a vector of a few thousand numbers. No single number means much; the meaning is in where the whole vector points.</p>"},
  "Each ID picks a row": {
    what: "<p>The <b>embedding table</b> has one row (a vector) per token in the vocabulary. <b>Embedding</b> a token means looking up its row by ID.</p>",
    analogy: DUO("A dictionary where each word's entry is a list of numbers instead of a definition.",
                 "<code>Map&lt;tokenId, float[]&gt;</code>, or a categorical feature lookup: you'd never do arithmetic on a user ID, so you map each ID to learned numbers."),
    real: "<p>100,000 rows × 4,096 numbers ≈ 410 million learned numbers, just for this table. The same token always reads the same row; context is added later, by attention.</p>"},
  "Training moves similar words together": {
    what: "<p>Rows start as random numbers. During <b>training</b> the model keeps predicting the next word, and every mistake nudges the rows involved. Words used in similar sentences get similar nudges.</p>",
    analogy: DUO("People who keep turning up at the same events end up in the same friend group, without anyone assigning them.",
                 "Collaborative filtering: users who buy similar things end up with similar learned vectors, with no one labelling them."),
    real: "<p>“Feed the ___” and “the ___ is asleep” push cat and dog in the same directions, so their rows drift together over billions of examples. Nobody labels them as animals; their usage does.</p>",
    evidence: "<p>The word2vec models learned high-quality word vectors from 1.6 billion words in under a day, and the vectors captured both syntactic and semantic similarity." + SRC("https://arxiv.org/abs/1301.3781","Mikolov et al., Efficient Estimation of Word Representations in Vector Space (2013)") + "</p>"},
  "Close means similar, and that is how it generalizes": {
    what: "<p>The distance between two rows is computable. <b>Generalization</b> means applying what was learned from one example to similar ones the model never saw.</p>",
    analogy: DUO("Having learned to drive one car, you can drive a similar one, because the controls are close to what you know.",
                 "Nearest-neighbour search: similar inputs land near each other, so a decision made for one point transfers to its neighbours."),
    real: "<p>Everything after the embedding is built from smooth functions (multiply, add, softmax, gentle curves), so small input changes give small output changes. What the model learns from “the cat sat” carries over to “the dog sat”. Models usually measure the angle between vectors (cosine similarity).</p>"},
  "Position: order changes meaning": {
    what: "<p><b>Position information</b> tells the model where each token is. Attention by itself compares contents, not places, so without it, reordering the words hands attention the same vectors.</p>",
    analogy: DUO("Pages of a letter with no page numbers dropped on the floor: all the words are there, the meaning isn't.",
                 "TCP sequence numbers: packets can arrive in any order; the numbers let the receiver rebuild the stream."),
    real: "<p>Older models add a learned row per position (a hard length limit). Most modern models use <b>RoPE</b>: they rotate the query and key vectors by an angle that depends on position, so attention scores depend on how far apart two tokens are.</p><p>Nuance: models that only look backward can still pick up some sense of position on their own, from how many earlier tokens each one can see. Explicit position, usually RoPE, is still the standard design.</p>",
    evidence: "<p>RoPE encodes absolute position as a rotation and builds relative distance into attention, with dependency that decays as tokens get farther apart." + SRC("https://arxiv.org/abs/2104.09864","Su et al., RoFormer (2021)") + "</p><p>Language models that only look backward, trained with no positional encoding at all, still learned an implicit sense of absolute position and stayed competitive with standard models." + SRC("https://arxiv.org/abs/2203.16634","Haviv et al., Transformer Language Models without Positional Encodings Still Learn Positional Information (2022)") + "</p>"},
  "Training writes. Using only reads.": {
    what: "<p><b>Weights</b> are the learned numbers (the embedding table and everything else); they change only during training. <b>Activations</b> are the vectors computed while handling one request; they're thrown away afterwards.</p>",
    analogy: DUO("A recipe book versus tonight's cooking: you read the recipe, cook a meal, and the book is unchanged.",
                 "Read-only reference rows versus values computed in a SELECT: every request reads the table, none of them UPDATEs it."),
    real: "<p>At inference the weights are frozen, which is why one copy in GPU memory can serve many users at once. Each request's activations (its working vectors) are private and temporary.</p>"},
  "Dot product: how well two lists match": {
    what: "<p>The <b>dot product</b> multiplies two vectors position by position and adds the results into one number: large when they point the same way, zero at right angles, negative when opposite.</p>",
    analogy: DUO("Matching a job's requirements against a candidate's skills: each skill counts only if both have it, and the total is the fit.",
                 "A weighted relevance score: <code>sum(query[i] * doc[i])</code>, the core of vector search."),
    real: "<p>It's the closeness idea from 1.2 as a single number. Attention uses it to score how relevant each earlier word is to the current one.</p>"},
  "Softmax: turn scores into percentages": {
    what: "<p><b>Softmax</b> turns any list of scores into positive shares that add up to 100%: raise e to each score, then divide each by the total.</p>",
    analogy: DUO("Splitting a bonus pool by performance score: everyone gets a share, the best get much more, and the shares always add up to the pool.",
                 "Normalizing weights for weighted random selection, with an exponent that exaggerates the leader."),
    real: "<p>The exponent keeps every share positive and stretches the gaps, so the top score wins clearly while the others keep a little. Shares must sum to 1 because the next step is an average.</p>",
    evidence: "<p>3Blue1Brown animates softmax inside attention, including why it's the right choice for weights." + SRC("https://www.youtube.com/watch?v=eMlx5fFNoYc","Attention in transformers, step-by-step") + "</p>"},
  "Weighted average: blend by the percentages": {
    what: "<p>A <b>weighted average</b> mixes several vectors, each multiplied by its share; the shares come from softmax.</p>",
    analogy: DUO("Mixing paint: 70% blue and 30% yellow lands between the two, closer to blue.",
                 "A blended score in a ranking system: <code>0.7 × signalA + 0.3 × signalB</code>."),
    real: "<p>Dot product (score every word) → softmax (scores to shares) → weighted average (blend) is all of attention. You'll see the three run together in 1.3.</p>"},
  "Gradient: how training nudges each number": {
    what: "<p>A <b>gradient</b> says, for each number, how much the error would change if that number moved a little. Training moves every number a small step in the direction that reduces the error.</p>",
    analogy: DUO("Adjusting a recipe after tasting: too salty, so cut the salt most, because salt had the biggest effect on the taste.",
                 "A profiler for error: blame is attributed to each config value in proportion to how much it contributed, and each is adjusted accordingly, all at once."),
    real: "<p><b>Backpropagation</b> computes every number's gradient in one backward pass. Repeated over billions of sentences, these nudges set the embedding rows, the attention matrices, and everything else.</p>",
    evidence: "<p>3Blue1Brown's chapters on gradient descent and backpropagation animate this." + SRC("https://www.youtube.com/watch?v=IHZwWFHWa-w","Gradient descent, how neural networks learn") + "</p>"},
  "bank has one row, but two meanings": {
    what: "<p><b>Attention</b> updates each word's vector using the words before it, so the same row ends up meaning different things in different sentences.</p>",
    analogy: DUO("“Bank” in a conversation: you work out which meaning from the words around it, not from the word alone.",
                 "Resolving a variable's value from its surrounding scope at runtime, rather than from its declaration alone."),
    real: "<p>bank's row is the same in both sentences; the blended vector after attention is not. That blended vector is an activation, computed for this sentence and discarded after.</p>"},
  "The three basics, running together": {
    what: "<p>Each word computes a <b>query</b> (what it's looking for); every earlier word offers a <b>key</b> (what it matches on) and a <b>value</b> (what it hands over). Score = query · key, softmax, then blend the values.</p>",
    analogy: DUO("Asking a room “who knows about water?”: people whose expertise matches answer loudest, and you take in a mix of what they say.",
                 "A search engine that returns a blend of every document, weighted by relevance, instead of only the top hit: a soft lookup."),
    real: "<p>query = x × W_Q, key = x × W_K, value = x × W_V, where the three matrices are learned weights. Scores are divided by √(vector size) before softmax so they don't grow too large.</p>",
    evidence: "<p>This is scaled dot-product attention as defined in the original transformer paper." + SRC("https://arxiv.org/abs/1706.03762","Vaswani et al., Attention Is All You Need (2017)") + "</p>"},
  "Who does each token listen to?": {
    what: "<p>The <b>attention weights</b> (the softmax shares) say how much each word draws from each earlier word. They always add up to 1 per word.</p>",
    analogy: DUO("Each person in a meeting deciding how much to weigh each earlier speaker.",
                 "A per-row weight vector over earlier rows, like a learned, content-based window function."),
    real: "<p>A word only looks backward (the reason comes with training, in 1.7). Real models learn these weights; the ones shown are hand-picked to illustrate the pattern.</p>"},
  "Several heads: one blend per need": {
    what: "<p>A <b>head</b> is one complete copy of attention with its own query, key and value matrices. <b>Multi-head attention</b> runs several heads side by side, joins their outputs, and multiplies by <b>W_O</b>, a learned matrix that mixes the joined head outputs back to the model's width.</p>",
    analogy: DUO("Asking several specialists the same question at once (a geographer, a grammarian) instead of one generalist who has to average their views.",
                 "Fanning one request out to several specialised indexes in parallel, then merging the responses."),
    real: "<p>Heads split the width rather than adding to it: 32 heads × 128 numbers = 4,096. Each head gets its own softmax, so it can focus sharply on its own target.</p>",
    evidence: "<p>The original transformer introduced multi-head attention so the model can attend to information from different representation subspaces at once." + SRC("https://arxiv.org/abs/1706.03762","Vaswani et al. (2017)") + "</p>"},
  "Cost grows with the square of the context": {
    what: "<p>Every token scores every earlier token, so the number of scores grows with the square of the number of tokens.</p>",
    analogy: DUO("Introductions at a party: with twice as many guests, there are about four times as many handshakes.",
                 "A self-join done as a nested loop: every row compared with every row."),
    real: "<p>8,000 tokens → 64 million scores; 16,000 → 256 million; 128,000 → about 16 billion, per head, per layer. This is why long context is expensive and why token counts matter.</p>",
    evidence: "<p>Self-attention's time and memory grow quadratically with sequence length; FlashAttention speeds it up by reading and writing GPU memory more carefully, without approximating." + SRC("https://arxiv.org/abs/2205.14135","Dao et al., FlashAttention (2022)") + "</p>"}
};
STEPS.forEach(s => { if(PANELS[s.title]) s.x = Object.assign({}, PANELS[s.title], s.x); });

/* ================= answer store ================= */
const CH = "L1";
const answers = {}; let db = null, finished = false, storeText = "Connecting to your answer store…";
const LS = "ael-lesson-1";
try{ const s = JSON.parse(localStorage.getItem(LS) || "{}"); Object.assign(answers, s.answers || {}); finished = !!s.finished; }catch(e){}
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({answers, finished, step:cur})); }catch(e){} }
function setStore(cls, t){ storeText = t; const p = $("#storePill"); if(p){ p.className = "pill " + cls; p.textContent = t; } storeCls = cls; }
let storeCls = "";
async function persist(id, body){
  answers[id] = body; lsSave(); if(!db) return false;
  const ref = db.doc("answers/" + CH + "-" + id), data = Object.assign({lesson:CH, qid:id}, body);
  try{ await ref.set(data); return true; }
  catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 500 + Math.random()*700)); try{ await ref.set(data); return true; }catch(e2){} }
    setStore("warn","Couldn't save to the store. Kept on this device; use Copy."); return false; }
}

/* ================= stepper ================= */
let cur = 0;
try{ const s = JSON.parse(localStorage.getItem(LS) || "{}"); if(Number.isInteger(s.step) && s.step < STEPS.length) cur = s.step; }catch(e){}
const CHS = [["M","Overview"],["1.1","1.1 Tokens"],["1.2","1.2 Embeddings"],["B","Basics"],["1.3","1.3 Attention"],["V","Videos"],["✓","Questions"]];
function render(){
  const st = STEPS[cur], card = $("#card");
  card.innerHTML = "";
  const content = STEPS.filter(s=>s.ch!=="V" && s.ch!=="✓"), ci = content.indexOf(st);
  const chLabel = st.ch==="B" ? "Basics" : st.ch==="M" ? "Overview" : "Chapter " + st.ch;
  card.append(el("span",{class:"step-tag"}, st.ch==="✓" ? "Questions" : st.ch==="V" ? "Videos" : chLabel + " · step " + (ci+1) + " of " + content.length));
  card.append(el("h2",{}, esc(st.title)));
  card.append(el("p",{class:"say"}, esc(st.say)));
  // Panels, each with one job: what it is, an analogy, then the visual, what's really happening, evidence.
  const panel = (cls, label, html) => { const d = el("div",{class:"panel " + cls}); d.innerHTML = '<p class="panel-l">' + label + '</p>' + html; return d; };
  if(st.x.what) card.append(panel("what", "What it is", st.x.what));
  if(st.x.analogy) card.append(panel("analogy", "Think of it like", st.x.analogy));
  const v = el("div",{class:"visual"}); card.append(v); st.render(v);
  if(st.x.real) card.append(panel("real", "What's actually happening", st.x.real));
  if(st.x.evidence) card.append(panel("evidence", "Evidence", st.x.evidence));
  // Links to other sites open in a new tab, so the lesson stays where it is.
  card.querySelectorAll('a[href^="http"]').forEach(a=>{ a.target = "_blank"; a.rel = "noopener"; });
  if(st.deeper){ const d = el("details",{class:"deeper"},'<summary>Go deeper</summary><p>' + st.deeper + '</p>'); card.append(d); }
  $("#back").disabled = cur===0; $("#next").disabled = cur===STEPS.length-1;
  $("#count").textContent = st.ch==="✓" ? "Questions" : st.ch==="V" ? "Videos" : (ci+1) + " / " + content.length;
  renderToc();
  $("#progress").innerHTML = content.map((_,i)=>'<span class="' + ((ci < 0 || i <= ci) ? "on" : "") + '"></span>').join("");
  $("#chapters").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current", b.dataset.ch===st.ch));
  if(storeCls) setStore(storeCls, storeText);
  lsSave();
}
$("#chapters").innerHTML = CHS.map(([k,l])=>'<button data-ch="' + k + '">' + l + '</button>').join("");

/* ---- step navigation: one path for every control, animated where supported ---- */
function go(n){
  if(n === cur || n < 0 || n >= STEPS.length) return;
  const r = document.documentElement, run = ()=>{ cur = n; render(); };
  if(document.startViewTransition && !reduceMotion){ r.dataset.dir = n > cur ? "fwd" : "back"; const t = document.startViewTransition(run); t.ready.catch(()=>{}); t.updateCallbackDone.catch(()=>{}); t.finished.catch(()=>{}).finally(()=>{ delete r.dataset.dir; }); }
  else run();
  if(window.scrollY > 0) window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"});
}
$("#chapters").addEventListener("click", e=>{ const k = e.target.dataset.ch; if(!k) return; go(STEPS.findIndex(s=>s.ch===k)); });
$("#back").addEventListener("click", ()=>go(cur-1));
$("#next").addEventListener("click", ()=>go(cur+1));
document.addEventListener("keydown", e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight") $("#next").click(); if(e.key==="ArrowLeft") $("#back").click(); });

/* ---- contents sidebar + chapter links (#ch-1-2) ---- */
const slugOf = k => "ch-" + String(k).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const seen = new Set();
function renderToc(){
  const host = document.getElementById("tocList"); if(!host) return;
  seen.add(cur);
  host.innerHTML = CHS.map(([k,l])=>{
    const items = STEPS.map((s,i)=>[s,i]).filter(([s])=>s.ch===k);
    const content = STEPS.filter(s=>s.ch!=="V" && s.ch!=="✓");
    return '<div class="grp"><p class="gl">' + esc(l) + '</p>' + items.map(([s,i])=>{
      const n = (k==="V"||k==="✓") ? "" : (content.indexOf(s)+1);
      return '<a data-go="' + i + '"' + (i===cur ? ' aria-current="step"' : '') + (seen.has(i) && i!==cur ? ' class="seen"' : '') + '><span class="n">' + n + '</span><span>' + esc(s.title) + '</span></a>';
    }).join("") + '</div>';
  }).join("");
  const now = host.querySelector('[aria-current="step"]'), box = host.closest(".toc");
  if(now && box && (now.offsetTop < box.scrollTop + 40 || now.offsetTop > box.scrollTop + box.clientHeight - 60)) box.scrollTop = now.offsetTop - box.clientHeight/2;
}
document.addEventListener("click", e=>{ const a = e.target.closest("[data-go]"); if(!a) return; go(+a.dataset.go); });
function fromHash(){ const h = location.hash.slice(1); if(!h) return false;
  const k = CHS.map(c=>c[0]).find(k=>slugOf(k)===h); if(!k) return false;
  cur = STEPS.findIndex(s=>s.ch===k); return true; }
window.addEventListener("hashchange", ()=>{ if(fromHash()) render(); });
fromHash();
render();

/* ---- theme toggle + collapsible contents (preferences remembered) ---- */
(function(){
  const r = document.documentElement, store = (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const tb = document.getElementById("themeBtn"), cb = document.getElementById("tocBtn");
  const dark = ()=> r.dataset.theme ? r.dataset.theme === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const syncT = ()=>{ tb.textContent = dark() ? "Light mode" : "Dark mode"; tb.setAttribute("aria-pressed", String(dark())); };
  const smooth = fn => { if(!(document.startViewTransition && !reduceMotion)) return fn();
    const t = document.startViewTransition(fn); t.ready.catch(()=>{}); t.finished.catch(()=>{}); t.updateCallbackDone.catch(()=>{}); return t; };
  tb.addEventListener("click", ()=>smooth(()=>{ r.dataset.theme = dark() ? "light" : "dark"; store("ael-theme", r.dataset.theme); syncT(); render(); }));
  const syncC = ()=>{ const c = r.classList.contains("toc-collapsed"); cb.setAttribute("aria-expanded", String(!c)); cb.setAttribute("aria-label", c ? "Show contents" : "Hide contents"); cb.title = c ? "Show contents" : "Hide contents"; };
  cb.addEventListener("click", ()=>smooth(()=>{ r.classList.toggle("toc-collapsed"); store("ael-toc", r.classList.contains("toc-collapsed") ? "0" : "1"); syncC(); }));
  syncT(); syncC();
})();

})();
</script>
</body>
</html>
