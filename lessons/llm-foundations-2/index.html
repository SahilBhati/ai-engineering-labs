const QS = [
  ["warm-up · L1","w1","Why do LLMs use subword tokens instead of characters or whole words?"],
  ["warm-up · L1","w2","Who decides a token's query, and how does it get good at finding useful words?"],
  ["warm-up · L1","w3","What does softmax do to a list of scores, and why must the results add up to 100%?"],
  ["warm-up · L1","w4","Why run several attention heads instead of one at the same total width?"],
  ["warm-up · L1","w5","Context goes from 8k to 16k tokens. What happens to attention's work in prefill, and why?"],
  ["mechanism","q1","What does the MLP do that attention doesn't?"],
  ["mechanism","q2","What is the residual stream, and what would break without it?"],
  ["numbers","q3","Estimate the parameters and the 16-bit memory of a model with width 4,096 and 32 layers. Show the formula."],
  ["mechanism","q4","How does the final vector become a probability for every token in the vocabulary?"],
  ["mechanism","q5","What does temperature do, mechanically? What happens as it approaches 0?"],
  ["design","q6","What does top-p do, and why would you use it?"],
  ["mechanism","q7","Why does generating without a cache take work that grows with the square of the output length?"],
  ["mechanism","q8","What exactly does the KV cache store, and why can it be reused?"],
  ["distinction","q9","Prefill vs decode: which sets time to first token, which sets time per token, and why are they different kinds of work?"],
  ["numbers","q10","Compute the KV cache per token and per 8K-token request for 80 layers, 8 KV heads, head size 128, 16-bit."],
  ["consequence","q11","A 70B model on two 80 GB GPUs: why do only a handful of 8K-context requests fit at once? Name two ways to fit more."],
  ["transfer","q12","Every request to a chatbot starts with the same 2,000-token system prompt. How could the server avoid redoing that work?"],
  ["backend","q13","Which backend pattern is the KV cache like, and which is the residual stream like?"]
];
add("✓","Check yourself",
 "Answer each question out loud or in your notes before looking anything up. If one is hard, go back to its step.",
 v=>{
  QS.forEach(([tag,id,p],n)=>{
    const q = el("div",{class:"q"});
    q.innerHTML = '<span class="tag">' + (n+1) + ' · ' + esc(tag.replace("warm-up · L1","review · lesson 1")) + '</span><p>' + esc(p) + '</p>';
    v.appendChild(q);
  });
 });


/* ---------- Explanation panels for 1.5 and 1.6 (attached by step title) ---------- */
const DUO = (a, b) => '<div class="duo"><div><b>Everyday</b><span>' + a + '</span></div><div><b>Technical</b><span>' + b + '</span></div></div>';
const PANELS = {
  "The last vector scores every token in the vocabulary": {
    what: "<p><b>Logits</b> are raw scores, one for every word in the vocabulary (about 100,000), made by comparing bank's final vector with each word's row in the <b>unembedding</b> table. <b>Softmax</b> (Basics, step 12) turns them into probabilities that add up to 100%. This answers the lesson's question.</p>",
    analogy: DUO("Scoring one job posting against every applicant's CV: one match score per applicant, then turned into shortlist chances.",
                 "Brute-force ranking with no index: score every candidate against the query on every request, then normalize the scores into a distribution."),
    real: "<p><code>logits = W_unembed · x</code>, a vocabulary × width table (100k × 4,096 ≈ 410 million multiply-adds per generated token for this step alone). It's the same shape as the embedding table; some models share the two.</p>",
    evidence: '<p>Researchers reuse exactly this scoring step on the middle of the model to read its guess after each block (the logit lens from 1.4, step 5). <a href="https://www.greaterwrong.com/posts/AcKRB8wDpdaN6v6ru/interpreting-gpt-the-logit-lens">interpreting GPT: the logit lens ↗</a></p>'},
  "Temperature: how sharp the choice is": {
    what: "<p><b>Temperature</b> is a number set per request (the <code>temperature</code> parameter in an API call). The logits are divided by it before softmax.</p>",
    analogy: DUO("A strict judge versus a relaxed one. Strict (low temperature): the favorite almost always wins. Relaxed (high): underdogs get real chances.",
                 "A sharpness knob on weighted routing: low sends nearly all traffic to the best backend, high spreads it across many."),
    real: "<p><code>p = softmax(logits / T)</code>. As T → 0 you get <b>greedy decoding</b> (always the top word). T = 1 is the model's own distribution. T > 1 flattens it. Dividing by a small number stretches the gaps, and softmax's exponent turns stretched gaps into a near-certain winner.</p>"},
  "Sampling: roll the dice, but cut the tail": {
    what: "<p><b>Sampling</b> means drawing the next word at random according to its probability. <b>Top-p</b> (also called <b>nucleus sampling</b>) first keeps only the most likely words whose probabilities add up to p, then draws among them.</p>",
    analogy: DUO("Picking tonight's restaurant by rolling dice, but only among the places that make up 90% of your past visits, never the one you tried once and hated.",
                 "Weighted random load balancing that first drops every backend below a cumulative-weight cutoff, then picks among the rest."),
    real: "<p>Sort words by probability, keep the smallest set reaching p (e.g. 0.9), rescale them to 100%, draw one. <b>Top-k</b> is the blunter version: keep the k best. A long answer is hundreds of these draws, so one unlucky pick can steer everything after it.</p>",
    evidence: '<p>Always picking the most likely word makes text “bland and strangely repetitive”; nucleus sampling keeps variety while cutting the unreliable tail. <a href="https://arxiv.org/abs/1904.09751">Holtzman et al., The Curious Case of Neural Text Degeneration (ICLR 2020) ↗</a></p>'},
  "Generation is a loop: one token per pass": {
    what: "<p><b>Autoregressive generation</b>: the model predicts one token, appends it to the input, and runs the whole model again, until it emits a stop token or hits a length limit. Our answer, “flooded”, was pass 1.</p>",
    analogy: DUO("Tapping your phone's autocomplete over and over: each tap adds one word, and the next suggestion depends on everything typed so far.",
                 "A loop whose output feeds its next input, like a fold over time, rather than one batch call that returns the whole answer."),
    real: "<p>Each pass runs every block on the sequence. Earlier tokens never change (a token only looks backward), so the keys and values computed for them on earlier passes are still valid. The next steps exploit that.</p>"},
  "Without a cache, work grows with the square of the length": {
    what: "<p>Without reuse, pass k reprocesses the whole prompt plus the k − 1 tokens already generated, even though nothing about them changed.</p>",
    analogy: DUO("Rereading a whole book from page one every time you want to write the next sentence of your review.",
                 "Recomputing an aggregate from scratch on every request instead of maintaining it incrementally, like a materialized view."),
    real: "<p>For n output tokens: about <code>n × prompt + n²/2</code> token positions without a cache, versus <code>prompt + n</code> with one. At 500 output tokens after a 2,000-token prompt that's over 1.1 million versus 2,500.</p>"},
  "The KV cache: compute keys and values once, keep them": {
    what: "<p>The <b>KV cache</b> stores every earlier token's <b>key</b> and <b>value</b> vectors (from attention, Lesson 1) for every layer, so later passes read them instead of recomputing them. K and V are the two things a token offers to others; the query is only needed for the newest token.</p>",
    analogy: DUO("Taking notes as you read, so you never reread a page: each new page is read once and added to the notes.",
                 "Memoization keyed by position: compute <code>(k_i, v_i)</code> once, append to a per-request store, read it on every later step."),
    real: "<p>Each decode step computes q, k, v for the new token only, appends its k and v, then attends over the whole cache. The cache grows by one row per token per layer and lives in GPU memory for the whole request.</p>",
    evidence: '<p>The cache is large and grows during a request; naive management wastes memory through fragmentation and duplication, which caps batch size. vLLM\'s PagedAttention manages it like OS virtual-memory pages: near-zero waste and 2–4× throughput at the same latency versus FasterTransformer and Orca. <a href="https://arxiv.org/abs/2309.06180">Kwon et al., PagedAttention (SOSP 2023) ↗</a></p>'},
  "Prefill and decode are two different jobs": {
    what: "<p><b>Prefill</b>: process the whole prompt in one parallel pass and fill the cache; it sets <b>TTFT</b> (time to first token). <b>Decode</b>: produce tokens one at a time; it sets <b>TPOT</b> (time per output token).</p>",
    analogy: DUO("A kitchen's prep and service. Prep chops everything at once before the first plate goes out; service then sends plates one by one.",
                 "A bulk load versus point queries: prefill is one big parallel batch (compute-bound); decode is many tiny sequential reads of all the weights and the cache (memory-bandwidth-bound)."),
    real: "<p>Decode does little math per byte it reads, so a GPU serving one request mostly waits on memory. Batching many users' decode steps together shares each read of the weights; that's continuous batching, and it's why KV memory per request decides throughput.</p>"},
  "How big is the KV cache?": {
    what: "<p>Per token, each layer stores one key and one value for each <b>KV head</b>. <b>Grouped-query attention (GQA)</b> lets several query heads share one KV head, which shrinks the cache.</p>",
    analogy: DUO("Luggage on a plane: the hold is fixed; the longer each passenger's trip (context), the more luggage, and the fewer passengers fit.",
                 "Session state per connection: a server's RAM caps concurrent sessions by per-session state size, not by CPU."),
    real: "<p><code>bytes = 2 × layers × KV heads × head size × bytes per number × tokens</code>. A 70B-class model at 8K tokens is about 2.7 GB per request, so concurrency on a GPU is set by this number more than by the weights.</p>",
    evidence: '<p>GQA uses a middle number of KV heads shared across groups of query heads and reaches quality close to full multi-head attention at speed close to multi-query attention. <a href="https://arxiv.org/abs/2305.13245">Ainslie et al., GQA (2023) ↗</a></p>'},
  "Why context windows have a limit": {
    what: "<p>The <b>context window</b> is the maximum number of tokens (prompt + output) a model handles in one request.</p>",
    analogy: DUO("A desk: you can only spread out so many pages, a bigger desk takes more room, and scanning everything on it takes longer.",
                 "A bounded buffer whose memory grows linearly with size and whose full scan (attention in prefill) grows quadratically."),
    real: "<p>Three limits: KV memory grows in line with tokens, prefill attention grows with their square, and the model only learned positions up to its training length. Long-context models extend training and cut costs (GQA, efficient attention kernels), but a 1M-token request still costs far more than a short one.</p>"}
};
STEPS.forEach(s => { if(PANELS[s.title]) s.x = Object.assign({}, PANELS[s.title], s.x); });

/* ================= answer store ================= */
const CH = "L2";
const answers = {}; let db = null, finished = false, storeText = "Connecting to your answer store…";
const LS = "ael-lesson-2";
try{ const s = JSON.parse(localStorage.getItem(LS) || "{}"); Object.assign(answers, s.answers || {}); finished = !!s.finished; }catch(e){}
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({answers, finished, step:cur})); }catch(e){} }
function setStore(cls, t){ storeText = t; const p = $("#storePill"); if(p){ p.className = "pill " + cls; p.textContent = t; } storeCls = cls; }
let storeCls = "";
async function persist(id, body){
  answers[id] = body; lsSave(); if(!db) return false;
  const ref = db.doc("answers/" + CH + "-" + id), data = Object.assign({lesson:CH, qid:id}, body);
  try{ await ref.set(data); return true; }
  catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 500 + Math.random()*700)); try{ await ref.set(data); return true; }catch(e2){} }
    setStore("warn","Couldn't save to the store. Kept on this device; use Copy."); return false; }
}

/* ================= stepper ================= */
let cur = 0;
try{ const s = JSON.parse(localStorage.getItem(LS) || "{}"); if(Number.isInteger(s.step) && s.step < STEPS.length) cur = s.step; }catch(e){}
const CHS = [["R","Recap · skippable"],["1.4","1.4 Block"],["1.5","1.5 Sampling"],["1.6","1.6 KV cache"],["V","Videos"],["✓","Questions"]];
function render(){
  const st = STEPS[cur], card = $("#card");
  card.innerHTML = "";
  const content = STEPS.filter(s=>!["V","✓","R"].includes(s.ch)), ci = content.indexOf(st);
  const chLabel = st.ch==="B" ? "Basics" : "Chapter " + st.ch;
  card.append(el("span",{class:"step-tag"}, st.ch==="✓" ? "Questions" : st.ch==="V" ? "Videos" : st.ch==="R" ? "Recap · skip it if you remember Lesson 1" : chLabel + " · step " + (ci+1) + " of " + content.length));
  card.append(el("h2",{}, esc(st.title)));
  card.append(el("p",{class:"say"}, esc(st.say)));
  // Panels, each with one job: what it is, an analogy, then the visual, what's really happening, evidence.
  const panel = (cls, label, html) => { const d = el("div",{class:"panel " + cls}); d.innerHTML = '<p class="panel-l">' + label + '</p>' + html; return d; };
  if(st.x.what) card.append(panel("what", "What it is", st.x.what));
  if(st.x.analogy) card.append(panel("analogy", "Think of it like", st.x.analogy));
  const v = el("div",{class:"visual"}); card.append(v); st.render(v);
  if(st.x.real) card.append(panel("real", "What's actually happening", st.x.real));
  if(st.x.evidence) card.append(panel("evidence", "Evidence", st.x.evidence));
  // Links to other sites open in a new tab, so the lesson stays where it is.
  card.querySelectorAll('a[href^="http"]').forEach(a=>{ a.target = "_blank"; a.rel = "noopener"; });
  if(st.deeper){ const d = el("details",{class:"deeper"},'<summary>Go deeper</summary><p>' + st.deeper + '</p>'); card.append(d); }
  if(st.ch==="R"){ const sk = el("button",{class:"ghost",id:"skipRecap"},"Skip recap →"); sk.addEventListener("click", ()=>go(STEPS.findIndex(s=>s.ch!=="R"))); card.append(sk); }
  $("#back").disabled = cur===0; $("#next").disabled = cur===STEPS.length-1;
  $("#count").textContent = st.ch==="✓" ? "Questions" : st.ch==="V" ? "Videos" : st.ch==="R" ? "Recap" : (ci+1) + " / " + content.length;
  renderToc();
  $("#progress").innerHTML = content.map((_,i)=>'<span class="' + ((ci < 0 || i <= ci) ? "on" : "") + '"></span>').join("");
  $("#chapters").querySelectorAll("button").forEach(b=>b.setAttribute("aria-current", b.dataset.ch===st.ch));
  if(storeCls) setStore(storeCls, storeText);
  lsSave();
}
$("#chapters").innerHTML = CHS.map(([k,l])=>'<button data-ch="' + k + '">' + l + '</button>').join("");

/* ---- step navigation: one path for every control, animated where supported ---- */
function go(n){
  if(n === cur || n < 0 || n >= STEPS.length) return;
  const r = document.documentElement, run = ()=>{ cur = n; render(); };
  if(document.startViewTransition && !reduceMotion){ r.dataset.dir = n > cur ? "fwd" : "back"; const t = document.startViewTransition(run); t.ready.catch(()=>{}); t.updateCallbackDone.catch(()=>{}); t.finished.catch(()=>{}).finally(()=>{ delete r.dataset.dir; }); }
  else run();
  if(window.scrollY > 0) window.scrollTo({top:0, behavior: reduceMotion ? "auto" : "smooth"});
}
$("#chapters").addEventListener("click", e=>{ const k = e.target.dataset.ch; if(!k) return; go(STEPS.findIndex(s=>s.ch===k)); });
$("#back").addEventListener("click", ()=>go(cur-1));
$("#next").addEventListener("click", ()=>go(cur+1));
document.addEventListener("keydown", e=>{ if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowRight") $("#next").click(); if(e.key==="ArrowLeft") $("#back").click(); });

/* ---- contents sidebar + chapter links (#ch-1-2) ---- */
const slugOf = k => "ch-" + String(k).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const seen = new Set();
function renderToc(){
  const host = document.getElementById("tocList"); if(!host) return;
  seen.add(cur);
  host.innerHTML = CHS.map(([k,l])=>{
    const items = STEPS.map((s,i)=>[s,i]).filter(([s])=>s.ch===k);
    const content = STEPS.filter(s=>!["V","✓","R"].includes(s.ch));
    return '<div class="grp"><p class="gl">' + esc(l) + '</p>' + items.map(([s,i])=>{
      const n = (k==="V"||k==="✓"||k==="R") ? "" : (content.indexOf(s)+1);
      return '<a data-go="' + i + '"' + (i===cur ? ' aria-current="step"' : '') + (seen.has(i) && i!==cur ? ' class="seen"' : '') + '><span class="n">' + n + '</span><span>' + esc(s.title) + '</span></a>';
    }).join("") + '</div>';
  }).join("");
  const now = host.querySelector('[aria-current="step"]'), box = host.closest(".toc");
  if(now && box && (now.offsetTop < box.scrollTop + 40 || now.offsetTop > box.scrollTop + box.clientHeight - 60)) box.scrollTop = now.offsetTop - box.clientHeight/2;
}
document.addEventListener("click", e=>{ const a = e.target.closest("[data-go]"); if(!a) return; go(+a.dataset.go); });
function fromHash(){ const h = location.hash.slice(1); if(!h) return false;
  const k = CHS.map(c=>c[0]).find(k=>slugOf(k)===h); if(!k) return false;
  cur = STEPS.findIndex(s=>s.ch===k); return true; }
window.addEventListener("hashchange", ()=>{ if(fromHash()) render(); });
fromHash();
render();

/* ---- theme toggle + collapsible contents (preferences remembered) ---- */
(function(){
  const r = document.documentElement, store = (k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const tb = document.getElementById("themeBtn"), cb = document.getElementById("tocBtn");
  const dark = ()=> r.dataset.theme ? r.dataset.theme === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  const syncT = ()=>{ tb.textContent = dark() ? "Light mode" : "Dark mode"; tb.setAttribute("aria-pressed", String(dark())); };
  const smooth = fn => { if(!(document.startViewTransition && !reduceMotion)) return fn();
    const t = document.startViewTransition(fn); t.ready.catch(()=>{}); t.finished.catch(()=>{}); t.updateCallbackDone.catch(()=>{}); return t; };
  tb.addEventListener("click", ()=>smooth(()=>{ r.dataset.theme = dark() ? "light" : "dark"; store("ael-theme", r.dataset.theme); syncT(); render(); }));
  const syncC = ()=>{ const c = r.classList.contains("toc-collapsed"); cb.setAttribute("aria-expanded", String(!c)); cb.setAttribute("aria-label", c ? "Show contents" : "Hide contents"); cb.title = c ? "Show contents" : "Hide contents"; };
  cb.addEventListener("click", ()=>smooth(()=>{ r.classList.toggle("toc-collapsed"); store("ael-toc", r.classList.contains("toc-collapsed") ? "0" : "1"); syncC(); }));
  syncT(); syncC();
})();

})();
</script>
</body>
</html>
